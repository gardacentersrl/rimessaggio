<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rimessaggio Garda Center · Area clienti</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f4f7fa;--fg:#1c2b36;--mut:#5d6f7c;--line:#d9e3ea;--card:#fff;--ok:#1f7a45;--ko:#b3312b;--acc:#3b6a92;--acc2:#2c5578;--tint:#dbe8f2;--hero:linear-gradient(135deg,#d3e3ef 0%,#eef4f8 70%);--f-d:'Fraunces',Georgia,serif;--f-b:'Public Sans',system-ui,sans-serif;--f-m:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--fg:#e4edf2;--mut:#93a7b4;--line:#27394544;--card:#16252e;--ok:#5fcf8c;--ko:#ff8a80;--acc:#7fb3d8;--acc2:#a7cbe6;--tint:#1d3442;--hero:linear-gradient(135deg,#1b3342 0%,#12212a 70%);color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);line-height:1.45}
.hero{background:var(--hero);padding:20px 16px 26px;border-bottom:1px solid var(--line)}
.hero .in{max-width:36rem;margin:0 auto}
.top{display:flex;justify-content:flex-end;gap:4px;margin-bottom:6px}
.top button{background:transparent;color:var(--acc);border:1px solid var(--line);padding:3px 9px;font-size:.8rem;border-radius:99px;font-weight:600;cursor:pointer;font-family:inherit}
.top button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:76px;height:auto;flex:none}
.kick{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font-family:var(--f-d);font-size:1.75rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.tag{margin:12px 0 0;color:var(--mut);max-width:30rem}
main{max-width:36rem;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-d);font-size:1.15rem;margin:0 0 4px}
h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 2px}
p{margin:0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(20,50,70,.05)}
form{display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:.92rem}
input,textarea,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
input[type=checkbox]{width:auto}
input#cod{font-family:var(--f-m);font-size:1.5rem;letter-spacing:.3em;text-align:center}
button.pri,button.alt{font:inherit;font-weight:600;border-radius:8px;padding:12px 16px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border:0}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{font-weight:600}.ko{color:var(--ko)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.s{font-size:.85rem;color:var(--mut)}.mono{font-family:var(--f-m);overflow-wrap:anywhere}
.hello{font-family:var(--f-d);font-size:1.3rem}
.veh{display:flex;gap:14px;align-items:center}
.plate{font-family:var(--f-m);font-weight:600;border:2px solid var(--fg);border-radius:6px;padding:2px 10px;letter-spacing:.06em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;background:var(--tint);font-size:.85rem;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}.pill.in .dot{background:var(--ok)}
.gate{background:var(--tint);border-radius:12px;padding:14px;text-align:center}
.gate .big{font-family:var(--f-m);font-size:2rem;letter-spacing:.2em;font-weight:600;color:var(--acc2)}
.bar{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.due{font-family:var(--f-d);font-size:1.9rem}
.sub{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.foot{text-align:center;font-size:.82rem;color:var(--mut);padding:8px 0}
#pv{border:2px solid var(--acc)}
</style></head>
<body>
<div class="hero"><div class="in">
 <div class="top" id="lg"></div>
 <div class="brand"><img src="logo.png" alt="Garda Center"><div><div class="kick">Garda Center</div><h1 id="h"></h1></div></div>

</div></div>
<main>
<div id="pv" class="card" hidden><b>Anteprima</b><p>Stai vedendo la pagina come la vede il cliente. I dati sono quelli dell'ultimo aggiornamento.</p></div>

<section id="v2" hidden><form id="f2" class="card">

<section id="v3" hidden><div id="app" style="display:flex;flex-direction:column;gap:16px"></div>
 <button id="ex" class="alt" type="button" style="margin-top:12px;width:100%"></button></section>
<div class="foot" id="ft"></div>
</main>

async function ridimensiona(f){if(f.type==='application/pdf')return f;var bm=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
 var b=await new Promise(function(r){cv.toBlob(r,'image/jpeg',.85)});b.nome=f.name.replace(/\.\w+$/,'')+'.jpg';return b}

<title>Area clienti Garda Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7f5;--fg:#1d2420;--mut:#5b665f;--line:#d9ded9;--card:#fff;--ok:#1f7a45;--ko:#b3312b;--acc:#245c7a;--f-d:'Fraunces',Georgia,serif;--f-b:'Public Sans',system-ui,sans-serif;--f-m:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--fg:#e6ebe7;--mut:#97a39b;--line:#2b342f;--card:#1b231f;--ok:#5fcf8c;--ko:#ff8a80;--acc:#7fb8d6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);padding:24px 16px 48px}
main{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-d);font-size:1.7rem;margin:0;text-wrap:balance}
h2{font-family:var(--f-d);font-size:1.15rem;margin:0 0 8px}
p{margin:0;line-height:1.5;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lg button{background:transparent;color:var(--acc);border:1px solid var(--line);padding:4px 8px;font-size:.85rem;margin-left:4px}
.lg button.on{background:var(--acc);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
form{display:flex;flex-direction:column;gap:10px}
label{font-weight:600}
input,textarea,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);width:100%}
input#cod{font-family:var(--f-m);font-size:1.4rem;letter-spacing:.3em;text-align:center}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:12px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{font-weight:600;line-height:1.4}.ko{color:var(--ko)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.big{font-family:var(--f-m);font-size:1.5rem;letter-spacing:.15em;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem;color:var(--mut)}
.mono{font-family:var(--f-m);overflow-wrap:anywhere}
.s{font-size:.85rem;color:var(--mut)}
</style></head>
<body><main>
<div class="top"><h1 id="h">Area clienti</h1><div class="lg" id="lg"></div></div>
<div id="pv" class="card" hidden style="border:2px solid var(--acc)"><b>Anteprima</b><p>Stai vedendo la pagina come la vede il cliente. I dati sono quelli dell'ultimo aggiornamento.</p></div>
<div id="m" class="msg" role="status"></div>

<section id="v1" hidden><form id="f1" class="card">
 <p id="t1"></p><label for="em" id="l1"></label><input id="em" type="email" autocomplete="email" inputmode="email" required>
 <button id="b1" type="submit"></button></form></section>

<section id="v2" hidden><form id="f2" class="card">
 <p id="t2"></p><label for="cod" id="l2"></label><input id="cod" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="6" required>
 <button id="b2" type="submit"></button><button id="b2x" class="alt" type="button"></button></form></section>

<section id="v3" hidden><div id="app" style="display:flex;flex-direction:column;gap:16px"></div>
 <button id="ex" class="alt" type="button" style="margin-top:8px"></button></section>
</main>

var $=function(s){return document.querySelector(s)},E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})};
var SK='ospite-tk',L=(function(){try{var l=localStorage.getItem('ospite-l');if(l&&D[l])return l}catch(e){}var n=(navigator.language||'it').slice(0,2);return D[n]?n:'en'})(),EM='',TK='',DATA=null,PREV=0;
function T(k){return D[L][k]}
function msg(t,ko){var m=$('#m');m.textContent=t||'';m.className='msg '+(ko?'ko':'ok')}
function lang(l){L=l;try{localStorage.setItem('ospite-l',l)}catch(e){}document.documentElement.lang=l;paint()}
function paint(){$('#h').textContent=T('h');$('#t1').textContent=T('t1');$('#l1').textContent=T('l1');$('#b1').textContent=T('b1');$('#t2').textContent=T('t2');$('#l2').textContent=T('l2');$('#b2').textContent=T('b2');$('#b2x').textContent=T('b2x');$('#ex').textContent=T('ex');
 $('#lg').innerHTML=['it','en','de'].map(function(l){return'<button type="button" class="'+(l===L?'on':'')+'" data-l="'+l+'">'+l.toUpperCase()+'</button>'}).join('');if(DATA)draw()}
$('#lg').onclick=function(e){var b=e.target.closest('[data-l]');if(b)lang(b.dataset.l)};
function show(n){['v1','v2','v3'].forEach(function(k){$('#'+k).hidden=k!=='v'+n})}
async function api(b){var r=await fetch(U+'/functions/v1/ospite',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});var j=null;try{j=await r.json()}catch(e){}if(!r.ok){var er=new Error((j&&j.error)||'errore');er.st=r.status;throw er}return j}
$('#f1').onsubmit=async function(e){e.preventDefault();EM=$('#em').value.trim().toLowerCase();$('#b1').disabled=true;msg('');
 try{await api({a:'codice',email:EM});show(2);$('#cod').value='';$('#cod').focus();msg(T('inviato'))}catch(x){msg(T('err'),1)}$('#b1').disabled=false};
$('#b2x').onclick=function(){show(1);msg('')};
$('#f2').onsubmit=async function(e){e.preventDefault();$('#b2').disabled=true;msg('');
 try{var r=await api({a:'entra',email:EM,codice:$('#cod').value});TK=r.token;try{sessionStorage.setItem(SK,TK)}catch(x){}await carica()}catch(x){msg(x.st===401?T('bad'):T('err'),1)}$('#b2').disabled=false};
$('#ex').onclick=function(){TK='';DATA=null;PREV=0;try{sessionStorage.removeItem('ospite-pv')}catch(e){}$('#pv').hidden=true;try{sessionStorage.removeItem(SK)}catch(e){}show(1);msg('')};
async function carica(){try{DATA=await api({a:'dati',token:TK});if(DATA.veicoli[0]&&DATA.veicoli[0].dati.L&&(PREV||!localStorage.getItem('ospite-l')))L=DATA.veicoli[0].dati.L;$('#pv').hidden=!PREV;paint();show(3);msg('')}

 var st=d.stato==='IN'?T('dentro'):d.stato==='OUT'?T('fuori'):T('nd');
 h+='<div class="card"><h2>'+T('mezzo')+': '+E(d.mezzo)+' '+E(d.targa)+'</h2><div class="row"><span>'+E(d.nome)+'</span><span class="pill">'+st+'</span></div>';
 if(d.area)h+='<div class="row"><span>'+T('area')+'</span><b>'+E(d.area)+'</b></div>';
 if(d.cod)h+='<div class="row"><span>'+T('cancello')+'</span><span class="big">'+E(d.cod)+'</span></div><p class="s">'+T('cancs')+'</p>';
 h+='</div>';

 if(d.iban&&(d.dap+(d.arr||0))>0.004)h+='<h2 style="margin-top:8px">'+T('bonifico')+'</h2><div class="row"><span>'+T('intest')+'</span><span>'+E(d.intest)+'</span></div><div class="row"><span>'+T('iban')+'</span><span class="mono">'+E(d.iban)+'</span></div>'+(d.bic?'<div class="row"><span>'+T('bic')+'</span><span class="mono">'+E(d.bic)+'</span></div>':'')+'<div class="row"><span>'+T('caus')+'</span><span>'+E(d.caus)+'</span></div>';
 h+='<p class="s">'+T('agg')+' '+dt(v.agg)+'</p></div>';
 h+='<div class="card"><h2>'+T('uscita')+'</h2>';

$('#app').onsubmit=async function(e){var f=e.target.closest('[data-u]');if(!f)return;e.preventDefault();var d=f.d.value;if(!d||d<=new Date().toISOString().slice(0,10))return msg(T('datein'),1);

async function ridimensiona(f){if(f.type==='application/pdf')return f;var bm=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
 var b=await new Promise(function(r){cv.toBlob(r,'image/jpeg',.85)});b.nome=f.name.replace(/\.\w+$/,'')+'.jpg';return b}

 try{var b=await ridimensiona(f),nome=b.nome||f.name,tipo=b.type||f.type;if(b.size>6*1024*1024)return msg(T('doctp'),1);
  var s=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(b)});
  await api({a:'doc',token:TK,cid:+i.dataset.f,nome:nome,tipo:tipo,dati:s});await carica();msg(T('docok'))}catch(x){msg(x.st===401?T('scad'):T('err'),1)}};
